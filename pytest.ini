[pytest]

# 文件日志配置
log_file = ./log/test.log
log_file_level = INFO
log_file_format = %(asctime)s %(levelname)-16s [函数:%(funcName)-18%]% (message)s [line:%(lineno)-3d]
#日志输出的格式 时间 日志级别 日志输出的信息
log_file_date_format = %Y-%m-%d %H:%M:%S
#时间的格式

# 控制台日志配置
log_cli = True
log_cli_level = INFO
log_cli_format = %(asctime)s %(levelname)s %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

#执行Mark
markers =
    serial: 串行链路用例
    parallel: 并行独立用例
